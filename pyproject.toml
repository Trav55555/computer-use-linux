[project]
name = "computer-use-linux"
version = "0.1.0"
description = "Local Codex computer use through the Linux desktop portal"
requires-python = ">=3.11"
dependencies = ["dbus-next==0.2.3", "mcp>=1.20,<2", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "ty>=0.0.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.environment]
root = ["scripts"]
